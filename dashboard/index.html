<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b0f" />
    <title>Sohail Studio</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  </head>
  <body>
    <div class="studio-shell">
      <header class="studio-header">
        <div class="studio-brand">
          <img src="/assets/sohail-avatar.png" alt="Sohail Avatar" class="brand-avatar" />
          <div>
            <div class="brand-name">Sohail Studio</div>
            <div class="brand-caption">Local-first AI engineering workspace</div>
          </div>
        </div>
        <nav class="top-nav" aria-label="Main navigation">
          <button class="nav-item active" data-route="home">Home</button>
          <button class="nav-item" data-route="workflows">Workflows</button>
          <button class="nav-item" data-route="terminal">Terminal</button>
          <button class="nav-item" data-route="sessions">Sessions</button>
        </nav>
        <div class="header-profile">
          <button class="header-button" data-route="settings">Settings</button>
        </div>
      </header>
      <div class="status-strip">
        <div class="connection-pill"><span class="status-dot"></span><span id="connection-label">Checking local API</span></div>
        <div class="status-context"><span>Workspace</span><strong>~/my-project</strong></div>
        <div class="status-context"><span>AI</span><strong id="status-ai-provider">Ollama</strong><em>/</em><strong id="status-ai-model">qwen3.5</strong></div>
        <div class="status-context status-context-right"><span>Mode</span><strong>Local only</strong></div>
      </div>
      <main class="studio-main">
        <div class="page-context"><span id="breadcrumb-root">Workspace</span><span class="slash">/</span><strong id="page-title">Home</strong></div>
        <div id="app" class="content"></div>
      </main>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script src="/assets/app.js"></script>
  </body>
</html>
